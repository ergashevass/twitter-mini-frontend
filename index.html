<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <title>Login Twitter</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="container">
        <div><i style="color: #1DA1F2; font-size: 50px;" class="fa-brands fa-twitter"></i></div>
        <div>
            <h1 class="title">Log in to Twitter</h1>
        </div>
       <form action="">
        <div><input id="username" type="text" placeholder="Please enter your username" required></div>
        <div>
            <input id="password" type="password" placeholder="Please enter your password" required>
        </div>
        <div id="error-message" style="color: red;"></div>
        <div>
            <button id="btn" type="button">Log In</button>
        </div>
       </form>
        <div>
            <a href="./html/signup.html">
                <p>Sign up to Twitter</p>
            </a>
        </div>
    </div>
</body>
<script src="./index.js" defer></script>

</html>
