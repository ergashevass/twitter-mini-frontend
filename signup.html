<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>SignUp Twitter</title>
</head>

<body>
    <img src="./back-twitter 1.png" alt="">
    <div class="container">
        <div><i style="color: #1DA1F2; font-size: 50px;" class="fa-brands fa-twitter"></i></div>
        <div>
            <h1 class="title">Create an account</h1>
        </div>
        <div><input type="text" placeholder="Please enter your name"></div>
        <div><input type="text" placeholder="Please enter your surname"></div>
        <div><input type="date" id="birthdate"></div>
        <div>
            <label for="profile-picture" class="custom-file-upload">
                Please enter your profile-picture
            </label>
            <input type="file" id="profile-picture" style="display: none;">
        </div>
        <div>
            <input type="text" placeholder="Please enter your username">
        </div>
        <div>
            <input type="password" placeholder="Please enter your password">
        </div>

        <div>
            <button type="submit">Sign Up</button>
        </div>
        <div>
            <a href="./index.html">
                <p>Log in to Twitter</p>
            </a>
        </div>
    </div>
</body>

</html>
